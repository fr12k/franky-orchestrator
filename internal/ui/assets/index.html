<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>franky orchestrator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Header -->
<header>
  <h1>franky<span> orchestrator</span></h1>
  <div class="spacer"></div>
  <span id="orch-pill" class="orch-pill">connecting…</span>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <input type="text" id="search-input" placeholder="Search agents…" autocomplete="off">
  <div id="filter-group" class="filter-group">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="idle">Idle</button>
    <button class="filter-btn" data-filter="streaming">Streaming</button>
    <button class="filter-btn" data-filter="error">Error</button>
    <button class="filter-btn" data-filter="offline">Offline</button>
  </div>
  <div class="spacer"></div>
  <button id="add-agent-btn" class="add-agent-btn">+ Add Agent</button>
  <div id="view-tabs" class="view-tabs">
    <button class="view-tab active" data-view="dashboard">Dashboard</button>
    <button class="view-tab" data-view="timeline">Timeline</button>
  </div>
</div>

<!-- Add Agent Modal -->
<div id="add-agent-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <h2>Add Agent Manually</h2>
    <form id="add-agent-form">
      <label>
        Name
        <input type="text" id="agent-name-input" placeholder="e.g. frankie" autocomplete="off" required>
      </label>
      <label>
        Host
        <input type="text" id="agent-host-input" placeholder="e.g. localhost:8789" autocomplete="off" required>
      </label>
      <div class="modal-actions">
        <button type="button" id="add-agent-cancel" class="btn-cancel">Cancel</button>
        <button type="submit" id="add-agent-submit" class="btn-primary">Add Agent</button>
      </div>
    </form>
  </div>
</div>

<!-- Main content -->
<main>
  <div id="agent-grid" class="agent-grid"></div>
  <div id="timeline-container" class="hidden">
    <!-- Timeline toolbar with agent + event type filters -->
    <div id="timeline-toolbar" class="timeline-toolbar">
      <div id="agent-tags" class="agent-tags"></div>
      <div class="spacer"></div>
      <div id="event-filters" class="event-filters">
        <button class="event-btn active" data-filter="all">All</button>
        <button class="event-btn" data-filter="user">User</button>
        <button class="event-btn" data-filter="assistant">Assistant</button>
        <button class="event-btn" data-filter="reasoning">Reasoning</button>
        <button class="event-btn" data-filter="tools">Tools</button>
        <button class="event-btn" data-filter="errors">Errors</button>
      </div>
    </div>
    <div id="waterfall"></div>
  </div>
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-icon">◎</div>
    <p>No agents connected</p>
    <p class="empty-hint">Start a franky agent with <code>--register http://localhost:9000</code></p>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
